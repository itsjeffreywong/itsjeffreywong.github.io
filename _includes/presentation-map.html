<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
  #presentation-map {
    width: 100%;
    height: 480px;
    margin: 1rem 0 2rem;
    border-radius: 12px;
    overflow: hidden;
    z-index: 1;
  }

  .presentation-map-entry {
    margin-bottom: 0.8rem;
    line-height: 1.35;
  }

  .presentation-map-entry:last-child {
    margin-bottom: 0;
  }

  #presentation-map-empty {
    padding: 1rem;
    border: 1px solid #ddd;
    border-radius: 8px;
  }
</style>

<div id="presentation-map"></div>
<div id="presentation-map-empty" style="display:none;">
  No mapped presentations yet.
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
(function () {
  const talks = [
    {% assign first_marker = true %}
    {% assign mapped_talks = site.talks | sort: "date" | reverse %}

    {% for talk in mapped_talks %}
      {% if talk.latitude and talk.longitude %}

        {% unless first_marker %},{% endunless %}

        {
          title: {{ talk.title | jsonify }},
          type: {{ talk.talk_type | default: talk.type | jsonify }},
          venue: {{ talk.venue | jsonify }},
          location: {{ talk.location | jsonify }},
          date: {{ talk.date | date: "%Y-%m-%d" | jsonify }},
          year: {{ talk.date | date: "%Y" | jsonify }},
          latitude: {{ talk.latitude | jsonify }},
          longitude: {{ talk.longitude | jsonify }},
          url: {{ talk.url | relative_url | jsonify }}
        }

        {% assign first_marker = false %}

      {% endif %}
    {% endfor %}
  ];

  if (talks.length === 0) {
    document.getElementById("presentation-map").style.display = "none";
    document.getElementById("presentation-map-empty").style.display = "block";
    return;
  }

  const map = L.map("presentation-map", {
    scrollWheelZoom: false
  });

  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom: 18,
      attribution:
        '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }
  ).addTo(map);

  const places = {};

  talks.forEach(function (talk) {
    const key = talk.latitude + "," + talk.longitude;

    if (!places[key]) {
      places[key] = {
        latitude: talk.latitude,
        longitude: talk.longitude,
        location: talk.location,
        talks: []
      };
    }

    places[key].talks.push(talk);
  });

  const bounds = [];

  Object.keys(places).forEach(function (key) {
    const place = places[key];

    const presentationHtml = place.talks.map(function (talk) {
      return `
        <div class="presentation-map-entry">
          <a href="${talk.url}">
            <strong>${talk.title}</strong>
          </a>
          <br>
          ${talk.type || ""}
          ${talk.venue ? " · " + talk.venue : ""}
          ${talk.year ? " · " + talk.year : ""}
        </div>
      `;
    }).join("");

    const popup = `
      <div>
        <strong>${place.location || ""}</strong>
        <hr>
        ${presentationHtml}
      </div>
    `;

    L.marker([place.latitude, place.longitude])
      .addTo(map)
      .bindPopup(popup, {
        maxWidth: 340
      });

    bounds.push([place.latitude, place.longitude]);
  });

  if (bounds.length === 1) {
    map.setView(bounds[0], 6);
  } else {
    map.fitBounds(bounds, {
      padding: [35, 35],
      maxZoom: 6
    });
  }
})();
</script>
