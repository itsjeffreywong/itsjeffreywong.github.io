<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  crossorigin=""
>

<div id="presentation-map"></div>

<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  crossorigin="">
</script>

<script>
document.addEventListener("DOMContentLoaded", function () {

  const talks = [
    {% assign mapped_talks = site.talks | where: "map", true %}
    {% for talk in mapped_talks %}
      {
        title: {{ talk.title | jsonify }},
        venue: {{ talk.venue | jsonify }},
        location: {{ talk.location | jsonify }},
        date: {{ talk.date | date: "%Y-%m-%d" | jsonify }},
        year: {{ talk.date | date: "%Y" | jsonify }},
        latitude: {{ talk.latitude | jsonify }},
        longitude: {{ talk.longitude | jsonify }},
        url: {{ talk.url | relative_url | jsonify }}
      }{% unless forloop.last %},{% endunless %}
    {% endfor %}
  ];

  const validTalks = talks.filter(t =>
    t.latitude !== null &&
    t.longitude !== null
  );

  const map = L.map("presentation-map", {
    scrollWheelZoom: false
  });

  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom: 18,
      attribution:
        '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }
  ).addTo(map);

  // Group presentations occurring at the same coordinates
  const places = {};

  validTalks.forEach(talk => {
    const key = `${talk.latitude},${talk.longitude}`;

    if (!places[key]) {
      places[key] = {
        latitude: talk.latitude,
        longitude: talk.longitude,
        location: talk.location,
        talks: []
      };
    }

    places[key].talks.push(talk);
  });

  const bounds = [];

  Object.values(places).forEach(place => {

    const presentations = place.talks
      .sort((a, b) => b.date.localeCompare(a.date))
      .map(talk => `
        <div class="presentation-map-entry">
          <a href="${talk.url}">
            <strong>${talk.title}</strong>
          </a>
          <br>
          ${talk.venue || ""}
          ${talk.year ? ` · ${talk.year}` : ""}
        </div>
      `)
      .join("");

    const popup = `
      <div class="presentation-map-popup">
        <strong>${place.location}</strong>
        <hr>
        ${presentations}
      </div>
    `;

    L.marker([place.latitude, place.longitude])
      .addTo(map)
      .bindPopup(popup, {
        maxWidth: 340
      });

    bounds.push([place.latitude, place.longitude]);
  });

  if (bounds.length > 1) {
    map.fitBounds(bounds, {
      padding: [35, 35],
      maxZoom: 6
    });
  } else if (bounds.length === 1) {
    map.setView(bounds[0], 6);
  } else {
    map.setView([45, -95], 3);
  }

});
</script>
